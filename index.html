<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wayback Machine CDX Query Builder</title></head><body><script>
(async()=>{try{const files=["chunks/00.txt", "chunks/01.txt", "chunks/02.txt", "chunks/03.txt", "chunks/04.txt", "chunks/05.txt", "chunks/06.txt", "chunks/07.txt"];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(f+': HTTP '+r.status);return r.text()})));const b=atob(parts.join(''));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);const r=new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip')));const h=await r.text();document.open();document.write(h);document.close()}catch(e){document.body.innerHTML='<pre style="font:16px monospace;color:#f88;background:#111;padding:2rem;white-space:pre-wrap">Failed to load CDX Query Builder:\n'+String(e).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]))+'</pre>'}})();
</script></body></html>
